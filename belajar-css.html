<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar CSS</title>
    <style>
        body {
            background-color: #f2f5f9;
            color: #263238;
            font-family: Arial, sans-serif;
            margin: 32px;
        }

        h1 {
            color: #1565c0;
        }

        .contoh {
            background-color: white;
            border-left: 4px solid #1565c0;
            padding: 16px;
        }

        #pesan {
            color: #2e7d32;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Belajar CSS</h1>
    <p>CSS digunakan untuk mengatur tampilan halaman HTML.</p>

    <div class="contoh">
        <h2>Contoh Selector</h2>
        <p>Selector elemen: judul ini menggunakan aturan CSS untuk <code>h1</code>.</p>
        <p id="pesan">Selector ID memberi gaya khusus pada pesan ini.</p>
    </div>
</body>
</html>
